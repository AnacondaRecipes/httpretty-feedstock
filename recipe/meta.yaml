{% set version = "1.1.4" %}

package:
  name: httpretty
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/h/httpretty/httpretty-{{ version }}.tar.gz
  sha256: 20de0e5dd5a18292d36d928cc3d6e52f8b2ac73daec40d41eb62dee154933b68

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3
    - pip
    - setuptools
    - wheel
  run:
    - python >=3
    - six

test:
  requires:
    - pip
  commands:
    - pip check
  imports:
    - httpretty

about:
  home: http://github.com/gabrielfalcao/httpretty
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: HTTP client mocking tool for Python
  description: |
    HTTPretty is a HTTP client mock library for Python 100% inspired on
    Ruby's FakeWeb.
  doc_url: https://httpretty.readthedocs.io/en/latest/
  dev_url: https://github.com/gabrielfalcao/httpretty

extra:
  recipe-maintainers:
    - ocefpaf
